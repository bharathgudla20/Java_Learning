name: Stockroom CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend and integration tests
        run: sh mvnw -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend syntax
        run: node --check src/main/resources/static/app.js
