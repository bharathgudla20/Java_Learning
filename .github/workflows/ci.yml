name: Stockroom CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend and integration tests
        run: sh mvnw -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend syntax
        run: node --check src/main/resources/static/app.js
  verify-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stockroom_test
          POSTGRES_USER: stockroom_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom_test -d stockroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify migrations and business invariants on PostgreSQL
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/stockroom_test
          TEST_DB_USER: stockroom_test
          TEST_DB_PASSWORD: ci-disposable-only
          TEST_FLYWAY: 'true'
          TEST_DDL_MODE: validate
        run: sh mvnw -B -ntp verify
